<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a0e22"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4de3ff"/>
      <stop offset="100%" stop-color="#b06bff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="620" fill="url(#bg)"/>
  <circle cx="450" cy="310" r="290" fill="none" stroke="#ff4d6d" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8"/>

  <text x="450" y="52" text-anchor="middle" font-size="30" font-weight="900" fill="#e8ecff" filter="url(#glow)">NEON SERPENT ARENA</text>
  <text x="450" y="78" text-anchor="middle" font-size="13" letter-spacing="3" fill="#8a93b8">EAT · EVOLVE · OUTPLAY · SURVIVE</text>

  <!-- center: player -->
  <g filter="url(#glow)">
    <circle cx="450" cy="310" r="34" fill="url(#accent)"/>
    <circle cx="440" cy="303" r="5" fill="#fff"/><circle cx="458" cy="303" r="5" fill="#fff"/>
    <circle cx="440" cy="304" r="2.4" fill="#0a0d1f"/><circle cx="458" cy="304" r="2.4" fill="#0a0d1f"/>
  </g>
  <text x="450" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#4de3ff">YOUR SERPENT</text>

  <!-- spokes -->
  <g font-size="12.5" fill="#cdd6f4">
    <!-- Grow -->
    <g transform="translate(150,150)">
      <rect x="-92" y="-30" width="184" height="60" rx="12" fill="#0d1330" stroke="#4de3ff" stroke-opacity="0.4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#4de3ff">🔮 EAT &amp; GROW</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">orbs · magnetism · fallen serpents</text>
    </g>
    <!-- Evolve -->
    <g transform="translate(450,140)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#0d1330" stroke="#ffd75e" stroke-opacity="0.4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd75e">🧬 EVOLVE · 5 FORMS</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">Hatchling → Viper → Python → Titan → Leviathan</text>
    </g>
    <!-- Boost -->
    <g transform="translate(750,150)">
      <rect x="-92" y="-30" width="184" height="60" rx="12" fill="#0d1330" stroke="#4de3ff" stroke-opacity="0.4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#4de3ff">⚡ BOOST</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">burns mass · drops orbs</text>
    </g>
    <!-- Powerups -->
    <g transform="translate(120,310)">
      <rect x="-100" y="-38" width="200" height="76" rx="12" fill="#0d1330" stroke="#b06bff" stroke-opacity="0.45"/>
      <text x="0" y="-16" text-anchor="middle" font-size="15" font-weight="800" fill="#b06bff">🎁 POWER-UPS</text>
      <text x="0" y="4" text-anchor="middle" fill="#9aa4c8">⚡ overdrive · 🧲 magnet · 🛡️ shield</text>
      <text x="0" y="22" text-anchor="middle" fill="#9aa4c8">💠 feast · 🦎 chameleon · 👿 soul-swap</text>
    </g>
    <!-- Threats -->
    <g transform="translate(780,310)">
      <rect x="-100" y="-38" width="200" height="76" rx="12" fill="#1a0a12" stroke="#ff4d6d" stroke-opacity="0.5"/>
      <text x="0" y="-16" text-anchor="middle" font-size="15" font-weight="800" fill="#ff4d6d">☠ THREATS</text>
      <text x="0" y="4" text-anchor="middle" fill="#c8909c">👹 Boss (3 HP) · 👻 Phantom</text>
      <text x="0" y="22" text-anchor="middle" fill="#c8909c">🧱 electrified wall</text>
    </g>
    <!-- Duels -->
    <g transform="translate(150,470)">
      <rect x="-100" y="-30" width="200" height="60" rx="12" fill="#0d1330" stroke="#4de3ff" stroke-opacity="0.4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#4de3ff">⚔️ DUELS</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">head-to-body kills · longer wins</text>
    </g>
    <!-- Secrets -->
    <g transform="translate(450,485)">
      <rect x="-110" y="-30" width="220" height="60" rx="12" fill="#12082a" stroke="#c9a8ff" stroke-opacity="0.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#c9a8ff">⟡ SECRETS</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">Cosmic Shards · secret skins · cheat code</text>
    </g>
    <!-- Meta -->
    <g transform="translate(750,470)">
      <rect x="-100" y="-30" width="200" height="60" rx="12" fill="#0d1330" stroke="#ffd75e" stroke-opacity="0.4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#ffd75e">📈 PROGRESSION</text>
      <text x="0" y="12" text-anchor="middle" fill="#9aa4c8">endless XP · 14 skins · dailies</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#4a5578" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M430 290 L200 175"/>
    <path d="M450 276 L450 172"/>
    <path d="M470 290 L700 175"/>
    <path d="M416 310 L222 310"/>
    <path d="M484 310 L680 310"/>
    <path d="M430 335 L210 455"/>
    <path d="M450 344 L450 455"/>
    <path d="M470 335 L690 455"/>
  </g>

  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#5a6488">Pure HTML · CSS · JavaScript — no frameworks, no backend, deploys as static files</text>
</svg>
